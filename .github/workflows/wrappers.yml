name: wrappers

# Wails desktop shell build (LYCM-300). Scoped to the wrapper + frontend sources
# so backend-only changes don't pay for it (mirrors argosy's per-area job split
# in mobile.yml). Builds the debug .exe and uploads it; signing/release is a
# separate concern. (The Android app is native Flutter, built by mobile.yml.)
on:
  pull_request:
    paths: ["wrappers/**", "web/**", ".github/workflows/wrappers.yml"]
  push:
    branches: [main]
    paths: ["wrappers/**", "web/**", ".github/workflows/wrappers.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with web/package.json's `packageManager` (the source of
      # truth), deploy/Dockerfile, web.yml and windows-release.yml: a newer
      # bun's module resolution breaks vue-tsc on .vue imports (LYCM-71).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-go@v5
        with:
          # Pinned, not `stable` (LYCM-131): Wails v2's package loader breaks on each
          # new Go major until a Wails release catches up, and `stable` moved the
          # runner to go1.27.0 the week it shipped, failing every build with
          # `internal error: package "context" without types was imported`. 1.26 is
          # the last series this job passed on. Keep in sync with
          # windows-release.yml, which runs the same Wails on the same build; bump
          # Go and Wails together there and here, after a local `wails build`.
          go-version: "1.26.x"
      # Vet + unit-test the wrapper module before the build: winstate is the
      # window-geometry persistence logic (LYCM-305); vet compiles package main
      # under the same tags `wails build` uses.
      - name: Vet + test wrapper module
        working-directory: wrappers/wails
        run: |
          go vet -tags desktop,production ./...
          go test ./winstate/
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1
      # copy-dist.mjs runs `bun run build:native` in web/, which needs vue-tsc —
      # install web deps explicitly so it's present regardless of whether wails
      # runs frontend:install.
      - name: Install web deps (for the Wails frontend build)
        run: bun install --cwd web --frozen-lockfile
      # frontend:build builds web/ in native mode and copies the bundle in.
      # -skipbindings: the app binds no Go methods (see app.go).
      - name: Build Windows .exe
        working-directory: wrappers/wails
        run: wails build -platform windows/amd64 -skipbindings
      - uses: actions/upload-artifact@v4
        with:
          name: lyceum-windows
          path: wrappers/wails/build/bin/Lyceum.exe
