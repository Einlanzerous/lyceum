name: mobile

# Native Flutter Android app (LYCM-700). Scoped to the Flutter sources so other
# changes don't pay for it. Mirrors Argosy's mobile.yml.
on:
  # The store-build guard below reads the release workflow, so a change to it —
  # adding the very --dart-define this exists to prevent, say — has to bring the
  # guard with it. (Spelled out twice: Actions' parser has no YAML anchors.)
  pull_request:
    paths:
      - "mobile/lyceum/**"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/mobile-release.yml"
  push:
    branches: [main]
    paths:
      - "mobile/lyceum/**"
      - ".github/workflows/mobile.yml"
      - ".github/workflows/mobile-release.yml"

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/lyceum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true
      - name: Resolve deps
        run: flutter pub get
      # Keeps the tree dart-format clean. It drifted once, and the cost lands on
      # whoever next runs `dart format` over a directory: their change arrives
      # buried in hundreds of lines of unrelated reformatting.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      # A public build must carry no server address — the invite QR supplies one
      # (LYCM-101/104). Only the config half runs here: there is no release
      # artifact on a PR, and mobile-release.yml scans the real one before it
      # ships. --self-test first, because a scanner that cannot fail is worse
      # than none — it reads as proof.
      - name: Store-build hygiene
        run: |
          tool/check_store_build.sh --self-test
          tool/check_store_build.sh
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lyceum-android-flutter-debug
          path: mobile/lyceum/build/app/outputs/flutter-apk/app-debug.apk
