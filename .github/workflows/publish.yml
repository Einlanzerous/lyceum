name: publish

# Builds the production image (deploy/Dockerfile: Vue reader SPA embedded into
# the Go binary) and pushes it to GHCR (LYCM-61). construct-server pulls
# ghcr.io/einlanzerous/lyceum:latest. main publishes :latest; release-please
# tags (v*) publish the semver tags.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/einlanzerous/lyceum
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build identity for /healthz (LYCM-121) — see deploy/Dockerfile.
          #
          # VERSION is passed ONLY on a tag build. On a push to main
          # `steps.meta.outputs.version` is `latest`, and `latest` names a
          # moving target rather than a build: reporting it would put the
          # string "latest" in the delivery ledger as an identity, to be
          # compared against whatever the image label says and disagree for
          # ever. Blank instead, which `internal/version` maps to "dev" — the
          # honest answer for a build no release cut.
          #
          # On a tag build metadata-action's `version` output is already the
          # BARE semver (`1.10.0`), matching the image label character for
          # character. That agreement is the whole point: the reconciler
          # observes this string and the deploy reporter reports the label, and
          # the matrix compares the two as identities.
          #
          # GIT_SHA is passed on both paths. A main build has a real commit and
          # should say so; it just has no release to name.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && steps.meta.outputs.version || '' }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
